services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pollify
      POSTGRES_USER: pollify
      POSTGRES_PASSWORD: pollify
    ports:
      - "5432:5432"
    volumes:
      - pollify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pollify
      DB_USER: pollify
      DB_PASSWORD: pollify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pollify_postgres_data:
