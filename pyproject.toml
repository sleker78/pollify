[project]
name = "pollify"
version = "0.1.0"
description = "A tiny polling API built on FastSpine - service-repository pattern, async Postgres, Redis caching."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastspine[postgres,redis,cli] @ git+https://github.com/sleker78/fastspine.git@v1.1.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
